<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Web Oficial de Álvaro</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
    background: linear-gradient(270deg, #ff6ec4, #7873f5, #4adede, #ffdd55, #ff6ec4);
    background-size: 1000% 1000%;
    animation: fondo 12s ease infinite;
    text-align: center;
    padding: 20px;
  }
  @keyframes fondo {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  h1 {
    font-size: clamp(2rem, 8vw, 4.5rem);
    color: #fff;
    text-shadow: 3px 3px 0 #000;
    animation: rebote 1.2s ease infinite alternate;
  }
  @keyframes rebote {
    from { transform: translateY(0) rotate(-2deg); }
    to { transform: translateY(-18px) rotate(2deg); }
  }
  .subtitulo { color: #fff; font-size: 1.2rem; margin: 14px 0 34px; text-shadow: 2px 2px 0 #000; }
  #boton {
    font-family: inherit;
    font-size: 1.4rem;
    font-weight: bold;
    padding: 18px 42px;
    border: 4px solid #000;
    border-radius: 999px;
    background: #ffdd55;
    cursor: pointer;
    box-shadow: 0 8px 0 #000;
    transition: transform .05s, box-shadow .05s;
  }
  #boton:active { transform: translateY(8px); box-shadow: 0 0 0 #000; }
  #contador { margin-top: 26px; color: #fff; font-size: 1.3rem; text-shadow: 2px 2px 0 #000; min-height: 2.4em; }
  .patito { font-size: 3.4rem; animation: girar 3s linear infinite; display: inline-block; margin-top: 30px; }
  @keyframes girar { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  footer { position: fixed; bottom: 10px; color: rgba(255,255,255,.85); font-size: .85rem; text-shadow: 1px 1px 0 #000; }
</style>
</head>
<body>
  <h1>🎉 LA WEB OFICIAL DE ÁLVARO 🎉</h1>
  <p class="subtitulo">Certificamos que Álvaro es, efectivamente, Álvaro.</p>
  <button id="boton">NO PULSES ESTE BOTÓN</button>
  <p id="contador"></p>
  <div class="patito">🦆</div>
  <footer>Hecha con tecnología de vanguardia y cero utilidad · 2026</footer>
<script>
  const frases = [
    "Te dije que no lo pulses.",
    "¿A qué no hay huevos que lo pulsas otra vez?",
    "Venga va, otra más.",
    "Estás enganchado, ¿eh?",
    "El pato te está juzgando.",
    "Pulsaciones oficiales registradas ante notario.",
    "Tu dedo tiene talento.",
    "Ni la NASA tiene un botón así.",
    "Vale, ya está bien... otra.",
    "Has desbloqueado absolutamente nada. ¡Enhorabuena!"
  ];
  let n = 0;
  const boton = document.getElementById("boton");
  const contador = document.getElementById("contador");
  boton.addEventListener("click", () => {
    n++;
    contador.textContent = frases[(n - 1) % frases.length] + " (llevas " + n + ")";
    boton.textContent = n % 5 === 0 ? "DE VERDAD, NO LO PULSES" : "NO PULSES ESTE BOTÓN";
  });
</script>
</body>
</html>
